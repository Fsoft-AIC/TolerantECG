defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - _self_

wandb_callback:
  _target_: src.callbacks.ptb_xl_callback.PtbXlCallback
  threshold: 0.5
  num_test_sample: 100

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/auroc"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: "val/auroc"
  patience: 10
  mode: "max"

model_summary:
  max_depth: -1
